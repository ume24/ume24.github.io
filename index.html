<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="ssquare">
    <div id="square2">
    <a href="https://kmu-likelion13.site/">링크 바로가기</a>
    <div id="titles">
    <img src="cute-maltese.jpg" alt="cute puppy" width="200" height="200">
    <h1>세션1 회원가입 실습</h1>
    
    <h3>회원가입</h3>
    </div>

    <fieldset>
        <legend>기본정보</legend>
        <label for="id">아이디</label>:
        <input type="text" id="id" placeholder="아이디는 8자 이상입니다."/>
        <br />
        <label for="password">비밀번호</label>:
        <input type="password" id="password" placeholder="비밀번호는 10자 이상입니다." />
        <br />
        <label>성별</label>:
        <label for="boy">남자</label>
        <input type="radio" id="boy" /> 
        <label for="girl">여자</label>
        <input type="radio" id="girl" />
    </fieldset>
    <fieldset>
        <legend>부가 정보</legend>
        <label>취미</label>: 
        <label for="movie">영화감상</label>
        <input type="checkbox" id="movie" />
        <label for="music">음악감상</label>
        <input type="checkbox" id="music" />
        <label for="독서">독서</label>
        <input type="checkbox" id="read" />
        <label for="sports">운동</label>
        <input type="checkbox" id="sports" />
        <br />
        <label for="profile">프로필 사진</label>:
        <input type="file" id="profile"/>
        <br />
        <label for="location">사는 지역</label>
        <select id="location">
            <option>서울</option>
            <option>서울밖에 없어요</option>
        </select>
        <br />
        <label for="introduction">자기소개</label>:
        <input type="text" id="introduction" placeholder="가벼운 자기소개를 입력해주세요." />
        <br />
        <button id="signUp">가입하기</button>
        <button id="rewrite">다시작성</button>

    </fieldset>
    </div>
    </div>
</body>
</html>
